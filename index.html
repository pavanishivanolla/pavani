<!DOCTYPE html>
<html>
<head>
    <title>My Resume</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>My Resume</h2>

    <h3>Personal Details</h3>
    <p><b>Name:</b> Your Name</p>
    <p><b>Email:</b> yourname@gmail.com</p>
    <p><b>Phone:</b> 9876543210</p>

    <h3>Career Objective</h3>
    <p>To obtain a good position in a reputed organization
       where I can improve my skills and knowledge.</p>

    <form onsubmit="return validateform()">

        <h3>Education</h3>
        <textarea id="education" placeholder="Enter your education details"></textarea>

        <h3>Skills</h3>
        <input type="text" id="skills" placeholder="Enter your skills">

        <h3>Projects</h3>
        <textarea id="projects" placeholder="Enter your projects"></textarea>

        <br><br>
        <button type="submit">Submit Resume</button>


    </form>

    <script src="validate.js"></script>

</body>
</html>
