
<!DOCTYPE html>
<html>
<head>
    <title>Weekly Timetable</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
        }

        th {
            background-color: navy;
            color: white;
        }

        td {
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Weekly Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>1-2 PM</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Java</td>
            <td>DBMS</td>
            <td>OS</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Python</td>
            <td>Java</td>
            <td>CN</td>
            <td>DBMS</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>OS</td>
            <td>CN</td>
            <td>Java</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DBMS</td>
            <td>OS</td>
            <td>Python</td>
            <td>CN</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>CN</td>
            <td>Java</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
    </table>

</body>
</html>
